<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识图谱可视化 - 音乐知识图谱问答系统</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        header h1 { font-size: 1.5em; }
        .back-link {
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            transition: background 0.3s;
        }
        .back-link:hover { background: rgba(255,255,255,0.3); }
        .content {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }
        .search-panel {
            width: 320px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-y: auto;
            flex-shrink: 0;
        }
        .search-panel h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: #667eea;
        }
        .search-box button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .search-box button:hover {
            opacity: 0.9;
        }
        .search-results {
            margin-bottom: 20px;
        }
        .search-result-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-result-item:hover { background: #e3f2fd; }
        .node-details {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .node-details h3 {
            color: #333;
            margin-bottom: 10px;
            word-break: break-all;
        }
        .neighbor-list {
            margin-top: 10px;
        }
        .neighbor-item {
            padding: 8px;
            background: white;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 14px;
            word-break: break-all;
        }
        .graph-container {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        #network {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .controls button {
            padding: 8px 16px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 6px;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .controls button:hover {
            background: #667eea;
            color: white;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .empty-tip {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }

        /* --- 音乐播放器 --- */
        .music-player {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .cover-img {
            width: 50px; height: 50px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .cover-img.rotate { animation: spin 10s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .song-details { flex: 1; overflow: hidden; }
        .song-title { font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
        .song-artist { font-size: 12px; color: #999; margin-top: 2px; }
        .progress-container { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; cursor: pointer; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; border-radius: 2px; transition: width 0.1s linear; }
        .player-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; }
        .control-btn { background: none; border: none; cursor: pointer; color: #666; font-size: 16px; transition: color 0.2s; padding: 2px 6px; }
        .control-btn:hover { color: #667eea; }
        .play-btn { font-size: 20px; color: #667eea; }
        #lyrics-box {
            height: 60px; overflow-y: auto; text-align: center;
            margin-top: 5px; font-size: 11px; color: #999; scrollbar-width: none;
        }
        #lyrics-box::-webkit-scrollbar { display: none; }
        .lyric-line { transition: all 0.3s; opacity: 0.5; padding: 2px 0; }
        .lyric-line.active { color: #667eea; font-weight: bold; font-size: 13px; opacity: 1; transition: all 0.3s ease; }
        .volume-control { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
        .volume-slider { width: 70px; height: 4px; -webkit-appearance: none; background: #e0e0e0; border-radius: 2px; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: #667eea; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>📊 知识图谱可视化</h1>
        <a href="/" class="back-link">← 返回问答</a>
    </header>

    <div class="content">
        <div class="search-panel">
            <h3>🔍 搜索实体</h3>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="输入实体名称，如：周杰伦、晴天">
                <button onclick="searchEntity()">搜索</button>
            </div>

            <div class="search-results" id="search-results">
                <div class="empty-tip">暂无搜索结果</div>
            </div>

            <div class="node-details" id="node-details" style="display:none;">
                <h3 id="node-name"></h3>
                <div class="neighbor-list" id="neighbor-list"></div>
            </div>
        </div>

        <div class="graph-container">
            <div id="network"></div>
            <div class="controls">
                <button onclick="fitGraph()">适应视图</button>
                <button onclick="resetGraph()">重置视图</button>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background:#667eea;"></div>
                    <span>歌手</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#4ecdc4;"></div>
                    <span>歌曲</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#ffa502;"></div>
                    <span>专辑</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // -------------------------- 模拟数据（无后端时使用，对接后端可删除） --------------------------
        const mockData = {
            // 初始图谱数据
            initNodes: [
                { id: 1, label: '周杰伦', type: 'Singer', size: 30 },
                { id: 2, label: '晴天', type: 'Song', size: 25 },
                { id: 3, label: '七里香', type: 'Album', size: 25 },
                { id: 4, label: '稻香', type: 'Song', size: 25 },
                { id: 5, label: '林俊杰', type: 'Singer', size: 30 },
                { id: 6, label: '江南', type: 'Song', size: 25 },
                { id: 7, label: '曹操', type: 'Album', size: 25 },
                { id: 8, label: '邓紫棋', type: 'Singer', size: 30 },
                { id: 9, label: '光年之外', type: 'Song', size: 25 },
            ],
            initEdges: [
                { from: 1, to: 2, relation: '演唱' },
                { from: 1, to: 3, relation: '发行' },
                { from: 1, to: 4, relation: '演唱' },
                { from: 3, to: 2, relation: '收录' },
                { from: 5, to: 6, relation: '演唱' },
                { from: 5, to: 7, relation: '发行' },
                { from: 7, to: 6, relation: '收录' },
                { from: 8, to: 9, relation: '演唱' },
            ],
            // 搜索匹配数据
            searchMap: {
                '周杰伦': { name: '周杰伦', type: '歌手' },
                '晴天': { name: '晴天', type: '歌曲' },
                '七里香': { name: '七里香', type: '专辑' },
                '稻香': { name: '稻香', type: '歌曲' },
                '林俊杰': { name: '林俊杰', type: '歌手' },
                '江南': { name: '江南', type: '歌曲' },
                '曹操': { name: '曹操', type: '专辑' },
                '邓紫棋': { name: '邓紫棋', type: '歌手' },
                '光年之外': { name: '光年之外', type: '歌曲' },
            },
            // 邻居数据
            neighborMap: {
                '周杰伦': [
                    { name: '晴天', type: 'Song', relation: '演唱' },
                    { name: '七里香', type: 'Album', relation: '发行' },
                    { name: '稻香', type: 'Song', relation: '演唱' },
                ],
                '晴天': [
                    { name: '周杰伦', type: 'Singer', relation: '演唱者' },
                    { name: '七里香', type: 'Album', relation: '所属专辑' },
                ],
                '七里香': [
                    { name: '周杰伦', type: 'Singer', relation: '歌手' },
                    { name: '晴天', type: 'Song', relation: '收录歌曲' },
                ],
                '林俊杰': [
                    { name: '江南', type: 'Song', relation: '演唱' },
                    { name: '曹操', type: 'Album', relation: '发行' },
                ]
            }
        };

        let network = null;
        let initNodes = [];
        let initEdges = [];

        function initNetwork() {
            const container = document.getElementById('network');

            const data = {
                nodes: new vis.DataSet([]),
                edges: new vis.DataSet([])
            };

            const options = {
                nodes: {
                    shape: 'dot',
                    size: 25,
                    font: {
                        size: 14,
                        color: '#333'
                    },
                    borderWidth: 2,
                    shadow: true
                },
                edges: {
                    width: 2,
                    color: {
                        color: '#999',
                        highlight: '#667eea'
                    },
                    arrows: {
                        to: { enabled: true, scaleFactor: 0.5 }
                    },
                    font: {
                        size: 12,
                        align: 'middle'
                    },
                    smooth: {
                        type: 'continuous'
                    }
                },
                physics: {
                    enabled: true,
                    stabilization: {
                        enabled: true,
                        iterations: 1000
                    },
                    barnesHut: {
                        gravitationalConstant: -2500,
                        springLength: 220
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200,
                    hideEdgesOnDrag: true
                }
            };

            network = new vis.Network(container, data, options);

            // 节点点击事件
            network.on('click', function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = data.nodes.get(nodeId);
                    if (node) {
                        locateNode(node.label);
                    }
                }
            });

            // 加载初始数据
            loadGraphData();
        }

        // 加载初始图谱数据
        async function loadGraphData() {
            try {
                // 优先请求后端接口，失败则使用模拟数据
                const response = await axios.get('/api/graph/nodes?limit=50', { timeout: 3000 });
                const payload = (response.data && response.data.data) ? response.data.data : response.data || {};
                initNodes = (payload.nodes || []).map(n => ({
                    id: n.id,
                    label: n.label,
                    color: n.color || getNodeColor(n.type),
                    size: n.size || 25
                }));
                initEdges = (payload.edges || []).map(e => ({
                    from: e.from,
                    to: e.to,
                    label: e.relation
                }));
            } catch (error) {
                // 接口失败，使用模拟数据
                console.log('后端接口不可用，使用模拟数据演示');
                initNodes = mockData.initNodes.map(n => ({
                    ...n,
                    color: getNodeColor(n.type)
                }));
                initEdges = mockData.initEdges;
            }

            network.setData({
                nodes: new vis.DataSet(initNodes),
                edges: new vis.DataSet(initEdges)
            });
            network.fit();
        }

        // 搜索实体
        async function searchEntity() {
            const keyword = document.getElementById('search-input').value.trim();
            const container = document.getElementById('search-results');
            
            if (!keyword) {
                container.innerHTML = '<div class="empty-tip">请输入搜索关键词</div>';
                return;
            }

            let results = [];
            try {
                // 优先请求后端接口
                const response = await axios.get(`/api/graph/search?keyword=${encodeURIComponent(keyword)}`, { timeout: 3000 });
                results = response.data.results || [];
            } catch (error) {
                // 接口失败，使用模拟搜索
                Object.keys(mockData.searchMap).forEach(name => {
                    if (name.includes(keyword)) {
                        results.push(mockData.searchMap[name]);
                    }
                });
            }

            container.innerHTML = '';
            if (results.length === 0) {
                container.innerHTML = '<div class="empty-tip">未找到匹配的实体</div>';
                return;
            }

            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-result-item';
                div.innerHTML = `<strong>${item.name}</strong> <span style="color:#999;">(${item.type})</span>`;
                div.onclick = () => locateNode(item.name);
                container.appendChild(div);
            });
        }

        // 定位并展示节点及邻居
        async function locateNode(name) {
            let neighbors = [];
            try {
                // 优先请求后端接口
                const response = await axios.get(`/api/graph/neighbors?name=${encodeURIComponent(name)}`, { timeout: 3000 });
                neighbors = response.data.neighbors || [];
            } catch (error) {
                // 接口失败，使用模拟邻居数据
                neighbors = mockData.neighborMap[name] || [];
            }

            // 更新图谱显示（中心节点+邻居）
            updateGraphData(name, neighbors);
            // 显示节点详情
            showNodeDetails(name, neighbors);
        }

        // 更新图谱为中心节点+邻居模式
        function updateGraphData(centerName, neighbors) {
            const nodes = new vis.DataSet();
            const edges = new vis.DataSet();

            // 中心节点（高亮红色）
            nodes.add({
                id: 0,
                label: centerName,
                color: '#ff6b6b',
                size: 35
            });

            // 邻居节点
            neighbors.forEach((neighbor, index) => {
                const nodeColor = getNodeColor(neighbor.type);
                nodes.add({
                    id: index + 1,
                    label: neighbor.name,
                    color: nodeColor,
                    size: 25
                });

                edges.add({
                    from: 0,
                    to: index + 1,
                    label: neighbor.relation
                });
            });

            network.setData({ nodes, edges });
            network.fit();
        }

        // 根据实体类型获取节点颜色
        function getNodeColor(type) {
            const colors = {
                'Singer': '#667eea',
                'Song': '#4ecdc4',
                'Album': '#ffa502',
                '歌手': '#667eea',
                '歌曲': '#4ecdc4',
                '专辑': '#ffa502'
            };
            return colors[type] || '#95a5a6';
        }

        // 显示节点详情面板
        function showNodeDetails(name, neighbors = []) {
            const container = document.getElementById('node-details');
            document.getElementById('node-name').textContent = name;

            let html = '<h4 style="margin-bottom: 8px; color: #666;">关联实体</h4>';
            if (neighbors.length === 0) {
                html += '<div class="empty-tip" style="padding: 10px 0;">暂无关联实体</div>';
            } else {
                neighbors.forEach(n => {
                    const typeText = n.type === 'Singer' ? '歌手' : n.type === 'Song' ? '歌曲' : n.type === 'Album' ? '专辑' : n.type;
                    html += `<div class="neighbor-item">${n.name} <span style="color:#999;">(${n.relation} · ${typeText})</span></div>`;
                });
            }

            document.getElementById('neighbor-list').innerHTML = html;
            container.style.display = 'block';
        }

        // 适应视图
        function fitGraph() {
            if (network) network.fit();
        }

        // 重置视图（恢复初始图谱）
        function resetGraph() {
            document.getElementById('node-details').style.display = 'none';
            document.getElementById('search-input').value = '';
            document.getElementById('search-results').innerHTML = '<div class="empty-tip">暂无搜索结果</div>';
            network.setData({
                nodes: new vis.DataSet(initNodes),
                edges: new vis.DataSet(initEdges)
            });
            network.fit();
        }

        // 回车搜索
        document.getElementById('search-input').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                searchEntity();
            }
        });

        window.onload = initNetwork;
    </script>

    <!-- 音乐播放器 -->
    <div class="music-player">
        <div class="player-info">
            <img src="{{ url_for('static', filename='赵雷-jpg.jpg') }}" alt="Cover" class="cover-img" id="coverImg" onerror="this.src='https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200&h=200&fit=crop'">
            <div class="song-details">
                <div class="song-title" id="songTitle">正在加载...</div>
                <div class="song-artist" id="songArtist">--</div>
            </div>
        </div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="player-controls">
            <button class="control-btn" id="prevBtn">⏮</button>
            <button class="control-btn play-btn" id="playBtn">▶</button>
            <button class="control-btn" id="nextBtn">⏭</button>
            <div class="volume-control">
                <span style="font-size:11px">🔊</span>
                <input type="range" min="0" max="100" step="1" value="50" class="volume-slider" id="volumeSlider">
            </div>
        </div>
        <div id="lyrics-box">
            <p class="lyric-line active">暂无歌词</p>
        </div>
    </div>

    let lyrics = [];

    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const coverImg = document.getElementById('coverImg');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const lyricsBox = document.getElementById('lyrics-box');
    const volumeSlider = document.getElementById('volumeSlider');

    loadSong(currentIndex);
    audio.volume = 0.5;

    // 跨页面播放状态恢复
    (function restorePlayerState() {
        const saved = sessionStorage.getItem('musicPlayerState');
        if (saved) {
            try {
                const state = JSON.parse(saved);
                currentIndex = state.currentIndex || 0;
                loadSong(currentIndex);
                audio.volume = state.volume || 0.5;
                volumeSlider.value = Math.round(audio.volume * 100);
                if (state.wasPlaying && state.currentTime) {
                    audio.currentTime = state.currentTime;
                    audio.addEventListener('canplay', function onCanPlay() {
                        audio.removeEventListener('canplay', onCanPlay);
                        playSong();
                    }, { once: true });
                }
            } catch(e) { console.log('恢复播放状态失败', e); }
        }
    })();

    window.addEventListener('beforeunload', function() {
        sessionStorage.setItem('musicPlayerState', JSON.stringify({
            currentIndex: currentIndex,
            currentTime: audio.currentTime || 0,
            wasPlaying: isPlaying,
            volume: audio.volume
        }));
    });

    function loadSong(index) {
        const song = playlist[index];
        songTitle.innerText = song.title;
        songArtist.innerText = song.artist;
        audio.src = song.src;
        coverImg.src = song.cover;
        progressBar.style.width = '0%';
        lyricsBox.innerHTML = '<p style="margin-top:10px; color:#999;">暂无歌词</p>';
        lyrics = [];
        fetch(song.lrc)
            .then(r => { if (!r.ok) throw new Error(); return r.text(); })
            .then(t => parseLRC(t))
            .catch(() => { lyricsBox.innerHTML = '<p style="margin-top:10px; color:#999;">纯音乐欣赏</p>'; });
    }

    function togglePlay() { isPlaying ? pauseSong() : playSong(); }
    function playSong() { isPlaying = true; playBtn.innerText = '⏸'; coverImg.classList.add('rotate'); audio.play().catch(() => { pauseSong(); }); }
    function pauseSong() { isPlaying = false; audio.pause(); playBtn.innerText = '▶'; coverImg.classList.remove('rotate'); }
    function prevSong() { currentIndex = currentIndex <= 0 ? playlist.length - 1 : currentIndex - 1; loadSong(currentIndex); if (isPlaying) playSong(); }
    function nextSong() { currentIndex = currentIndex >= playlist.length - 1 ? 0 : currentIndex + 1; loadSong(currentIndex); if (isPlaying) playSong(); }

    function updateProgress(e) {
        const { duration, currentTime } = e.srcElement;
        if (isNaN(duration)) return;
        progressBar.style.width = (currentTime / duration * 100) + '%';
        syncLyrics(currentTime);
    }

    progressContainer.addEventListener('click', function(e) {
        const duration = audio.duration;
        if (isNaN(duration)) return;
        audio.currentTime = (e.offsetX / this.clientWidth) * duration;
    });

    volumeSlider.addEventListener('input', function() { audio.volume = this.value / 100; });

    function parseLRC(lrcString) {
        lyrics = []; lyricsBox.innerHTML = '';
        lrcString.split('\n').filter(l => l.trim()).forEach(line => {
            const m = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/.exec(line);
            if (m) {
                const time = parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/100;
                const text = line.replace(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/, '').trim();
                if (text) {
                    lyrics.push({ time, text });
                    const p = document.createElement('p'); p.innerText = text; p.className = 'lyric-line'; p.dataset.time = time;
                    lyricsBox.appendChild(p);
                }
            }
        });
    }

    function syncLyrics(ct) {
        if (!lyrics.length) return;
        let ai = -1;
        for (let i = 0; i < lyrics.length; i++) { if (ct >= lyrics[i].time) ai = i; else break; }
        if (ai !== -1) {
            document.querySelectorAll('.lyric-line').forEach(l => l.classList.remove('active'));
            const al = document.querySelectorAll('.lyric-line')[ai];
            if (al) { al.classList.add('active'); lyricsBox.scrollTop = al.offsetTop - lyricsBox.clientHeight/2 + al.clientHeight/2; }
        }
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', nextSong);
    </script>

</body>
</html>
