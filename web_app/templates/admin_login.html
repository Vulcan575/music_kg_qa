<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 音乐知识图谱</title>
    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 60px;
            width: 440px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .login-header { text-align: center; margin-bottom: 35px; }
        .login-header h1 { font-size: 2em; margin-bottom: 10px; }
        .login-header p { color: #aaa; font-size: 14px; }

        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #ddd; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px 15px; border: none; border-radius: 8px;
            font-size: 14px; background: rgba(255, 255, 255, 0.15); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.4); }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2); }

        .btn-login {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; transition: all 0.3s; margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .footer-links { text-align: center; margin-top: 25px; font-size: 14px; }
        .footer-links a { color: #667eea; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }

        /* Toast 提示 */
        .toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 600;
            z-index: 9999; opacity: 0; transition: opacity 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #52c41a; color: #fff; }
        .toast.error { background: #ff4d4f; color: #fff; }
    </style>
</head>
<body>
    {% raw %}
    <div id="app">
        <div class="login-container">
            <div class="login-header">
                <h1>🔐 管理员登录</h1>
                <p>音乐知识图谱后台管理系统</p>
            </div>

            <div class="form-group">
                <label>账号</label>
                <input type="text" v-model="username" placeholder="请输入管理员账号">
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" v-model="password" placeholder="请输入密码" @keyup.enter="handleLogin">
            </div>

            <button class="btn-login" @click="handleLogin" :disabled="loading">
                {{ loading ? '登录中...' : '登 录' }}
            </button>

            <div class="footer-links">
                <a href="/login">← 返回用户登录</a>
            </div>
        </div>

        <div class="toast" :class="[toast.type, { show: toast.visible }]">{{ toast.message }}</div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    username: '',
                    password: '',
                    loading: false,
                    toast: { visible: false, message: '', type: '' }
                }
            },
            methods: {
                showToast(message, type) {
                    this.toast = { visible: true, message, type };
                    setTimeout(() => { this.toast.visible = false; }, 2500);
                },
                async handleLogin() {
                    if (!this.username || !this.password) {
                        this.showToast('请填写账号和密码', 'error');
                        return;
                    }
                    this.loading = true;
                    try {
                        const res = await axios.post('/api/admin/login', {
                            username: this.username,
                            password: this.password
                        });
                        if (res.data.success) {
                            this.showToast('登录成功', 'success');
                            setTimeout(() => {
                                window.location.href = res.data.redirect;
                            }, 800);
                        } else {
                            this.showToast(res.data.message || '登录失败', 'error');
                        }
                    } catch (err) {
                        this.showToast('登录失败，请检查网络', 'error');
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount('#app');
    </script>
    {% endraw %}
</body>
</html>
