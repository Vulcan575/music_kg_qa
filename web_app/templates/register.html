<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 音乐智能问答</title>
    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/axios@1.6.8/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .register-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .register-header { text-align: center; margin-bottom: 30px; }
        .register-header h1 { font-size: 2em; margin-bottom: 10px; color: #4ecdc4; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #fff; }
        .form-group input {
            width: 100%; padding: 12px 15px; border: none; border-radius: 8px;
            font-size: 14px; background: rgba(255, 255, 255, 0.15); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .form-group input:focus { outline: none; border-color: #667eea; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
        .btn-register { background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%); color: white; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4); }
        .btn-register:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .links { text-align: center; margin-top: 20px; }
        .links a { color: #667eea; text-decoration: none; font-size: 14px; }

        .rules { font-size: 12px; color: #ddd; line-height: 1.5; margin-top: 10px; list-style: none; padding: 0; }
        .rules li { margin: 5px 0; }
        .rules .valid { color: #52c41a; }

        /* --- 音乐播放器 --- */
        .music-player {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 320px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .cover-img {
            width: 60px; height: 60px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .cover-img.rotate { animation: spin 10s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .song-details { flex: 1; overflow: hidden; }
        .song-title { font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 12px; color: #aaa; margin-top: 4px; }

        .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; }
        .progress-bar { height: 100%; background: #4ecdc4; width: 0%; border-radius: 2px; transition: width 0.1s linear; }

        .player-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .control-btn { background: none; border: none; cursor: pointer; color: #aaa; font-size: 18px; transition: color 0.2s; padding: 4px 8px; }
        .control-btn:hover { color: #4ecdc4; }
        .play-btn { font-size: 24px; color: #4ecdc4; }

        #lyrics-box {
            height: 80px; overflow-y: auto; text-align: center;
            margin-top: 10px; font-size: 12px; color: #888; scrollbar-width: none;
        }
        #lyrics-box::-webkit-scrollbar { display: none; }
        .lyric-line { transition: all 0.3s; opacity: 0.5; padding: 3px 0; }
        .lyric-line.active { color: #4ecdc4; font-weight: bold; font-size: 14px; opacity: 1; transition: all 0.3s ease; }

        .volume-control { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
        .volume-slider { width: 80px; height: 4px; -webkit-appearance: none; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #4ecdc4; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
    <!-- 音乐播放器 (放在 Vue 外部，避免冲突) -->
    <div class="music-player">
        <div class="player-info">
            <img src="{{ url_for('static', filename='赵雷-jpg.jpg') }}" alt="Cover" class="cover-img" id="coverImg" onerror="this.src='https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200&h=200&fit=crop'">
            <div class="song-details">
                <div class="song-title" id="songTitle">正在加载...</div>
                <div class="song-artist" id="songArtist">--</div>
            </div>
        </div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="player-controls">
            <button class="control-btn" id="prevBtn">⏮</button>
            <button class="control-btn play-btn" id="playBtn">▶</button>
            <button class="control-btn" id="nextBtn">⏭</button>
            <div class="volume-control">
                <span style="font-size:12px">🔊</span>
                <input type="range" min="0" max="100" step="1" value="50" class="volume-slider" id="volumeSlider">
            </div>
        </div>
        <div id="lyrics-box">
            <p class="lyric-line active">暂无歌词</p>
        </div>
    </div>

    {% raw %}
    <div id="app">
        <div class="register-container">
            <div class="register-header">
                <h1>🔐 创建账户</h1>
                <p>加入音乐知识图谱问答社区</p>
            </div>

            <div class="form-group">
                <label>账号</label>
                <input type="text" v-model="username" placeholder="设置您的账号">
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" v-model="password" placeholder="设置密码 (8-16位)" @input="checkPassword">
                <ul class="rules">
                    <li :class="{ 'valid': rules.length }">长度 8-16 位</li>
                    <li :class="{ 'valid': rules.lowerUpper }">包含大小写字母</li>
                    <li :class="{ 'valid': rules.number }">包含数字</li>
                    <li :class="{ 'valid': rules.special }">包含特殊符号</li>
                </ul>
            </div>

            <div class="form-group">
                <label>确认密码</label>
                <input type="password" v-model="confirmPassword" placeholder="再次输入密码">
                <span style="color: #ff4d4f; font-size: 12px;" v-if="password && confirmPassword && password !== confirmPassword">
                    密码不一致！
                </span>
            </div>

            <button class="btn btn-register" @click="handleRegister" :disabled="!isFormValid">
                注册并登录
            </button>

            <div class="links">
                <a href="/login">← 返回登录</a>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    username: '',
                    password: '',
                    confirmPassword: '',
                    rules: {
                        length: false,
                        lowerUpper: false,
                        number: false,
                        special: false
                    }
                }
            },
            computed: {
                isFormValid() {
                    return this.username &&
                           this.password === this.confirmPassword &&
                           this.password.length > 0 &&
                           Object.values(this.rules).every(r => r);
                }
            },
            methods: {
                checkPassword() {
                    const p = this.password;
                    this.rules.length = p.length >= 8 && p.length <= 16;
                    this.rules.lowerUpper = /[a-zA-Z]/.test(p);
                    this.rules.number = /[0-9]/.test(p);
                    this.rules.special = /[!@#$%^&*(),.?":{}|<>]/.test(p);
                },
                async handleRegister() {
                    try {
                        const res = await axios.post('/api/register', {
                            username: this.username,
                            password: this.password,
                            confirm_password: this.confirmPassword
                        });
                        if (res.data.success) {
                            alert('注册成功！即将跳转登录');
                            window.location.href = '/login';
                        } else {
                            alert('注册失败: ' + res.data.message);
                        }
                    } catch (err) {
                        alert('注册请求失败');
                    }
                }
            }
        }).mount('#app');
    </script>
    {% endraw %}

    <!-- 音乐播放器脚本 (放在 Vue 外部) -->
    <script>
    const playlist = [
        {
            title: "程艾影", artist: "赵雷",
            src: "{{ url_for('static', filename='趙雷 - 程艾影.mp3') }}",
            lrc: "{{ url_for('static', filename='赵雷 - 程艾影.lrc.txt') }}",
            cover: "{{ url_for('static', filename='赵雷-jpg.jpg') }}"
        },
        {
            title: "朵", artist: "赵雷",
            src: "{{ url_for('static', filename='趙雷 - 朵.mp3') }}",
            lrc: "{{ url_for('static', filename='赵雷 - 朵.lrc.txt') }}",
            cover: "{{ url_for('static', filename='赵雷-jpg.jpg') }}"
        },
        {
            title: "民谣", artist: "赵雷",
            src: "{{ url_for('static', filename='趙雷 - 民謠.mp3') }}",
            lrc: "{{ url_for('static', filename='赵雷 - 民谣.lrc.txt') }}",
            cover: "{{ url_for('static', filename='赵雷-jpg.jpg') }}"
        },
        {
            title: "南方姑娘", artist: "赵雷",
            src: "{{ url_for('static', filename='趙雷 - 南方姑娘.mp3') }}",
            lrc: "{{ url_for('static', filename='赵雷 - 南方姑娘.lrc.txt') }}",
            cover: "{{ url_for('static', filename='赵雷-jpg.jpg') }}"
        },
        {
            title: "我记得", artist: "赵雷",
            src: "{{ url_for('static', filename='趙雷 - 我記得.mp3') }}",
            lrc: "{{ url_for('static', filename='赵雷 - 我记得.lrc.txt') }}",
            cover: "{{ url_for('static', filename='赵雷-jpg.jpg') }}"
        },
        {
            title: "青花瓷", artist: "周杰伦",
            src: "{{ url_for('static', filename='周杰倫 - 青花瓷.mp3') }}",
            lrc: "{{ url_for('static', filename='周杰伦 - 青花瓷.lrc.txt') }}",
            cover: "{{ url_for('static', filename='周杰伦.jpg.jpg') }}"
        },
        {
            title: "烟花易冷", artist: "周杰伦",
            src: "{{ url_for('static', filename='周杰倫 - 煙花易冷.mp3') }}",
            lrc: "{{ url_for('static', filename='周杰伦 - 烟花易冷.lrc.txt') }}",
            cover: "{{ url_for('static', filename='周杰伦.jpg.jpg') }}"
        }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    const audio = new Audio();
    let lyrics = [];

    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const coverImg = document.getElementById('coverImg');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const lyricsBox = document.getElementById('lyrics-box');
    const volumeSlider = document.getElementById('volumeSlider');

    loadSong(currentIndex);
    audio.volume = 0.5;

    // --- 跨页面播放状态恢复 ---
    (function restorePlayerState() {
        const saved = sessionStorage.getItem('musicPlayerState');
        if (saved) {
            try {
                const state = JSON.parse(saved);
                currentIndex = state.currentIndex || 0;
                loadSong(currentIndex);
                audio.volume = state.volume || 0.5;
                volumeSlider.value = Math.round(audio.volume * 100);
                if (state.wasPlaying && state.currentTime) {
                    audio.currentTime = state.currentTime;
                    audio.addEventListener('canplay', function onCanPlay() {
                        audio.removeEventListener('canplay', onCanPlay);
                        playSong();
                    }, { once: true });
                }
            } catch(e) { console.log('恢复播放状态失败', e); }
        }
    })();

    // 页面卸载前保存播放状态
    window.addEventListener('beforeunload', function() {
        sessionStorage.setItem('musicPlayerState', JSON.stringify({
            currentIndex: currentIndex,
            currentTime: audio.currentTime || 0,
            wasPlaying: isPlaying,
            volume: audio.volume
        }));
    });

    function loadSong(index) {
        const song = playlist[index];
        songTitle.innerText = song.title;
        songArtist.innerText = song.artist;
        audio.src = song.src;
        coverImg.src = song.cover;
        progressBar.style.width = '0%';
        lyricsBox.innerHTML = '<p style="margin-top:20px; color:#888;">暂无歌词</p>';
        lyrics = [];
        fetch(song.lrc)
            .then(r => { if (!r.ok) throw new Error(); return r.text(); })
            .then(t => parseLRC(t))
            .catch(() => { lyricsBox.innerHTML = '<p style="margin-top:20px; color:#888;">纯音乐欣赏</p>'; });
    }

    function togglePlay() { isPlaying ? pauseSong() : playSong(); }
    function playSong() { isPlaying = true; playBtn.innerText = '⏸'; coverImg.classList.add('rotate'); audio.play().catch(() => { pauseSong(); }); }
    function pauseSong() { isPlaying = false; audio.pause(); playBtn.innerText = '▶'; coverImg.classList.remove('rotate'); }
    function prevSong() { currentIndex = currentIndex <= 0 ? playlist.length - 1 : currentIndex - 1; loadSong(currentIndex); if (isPlaying) playSong(); }
    function nextSong() { currentIndex = currentIndex >= playlist.length - 1 ? 0 : currentIndex + 1; loadSong(currentIndex); if (isPlaying) playSong(); }

    function updateProgress(e) {
        const { duration, currentTime } = e.srcElement;
        if (isNaN(duration)) return;
        progressBar.style.width = (currentTime / duration * 100) + '%';
        syncLyrics(currentTime);
    }

    progressContainer.addEventListener('click', function(e) {
        const duration = audio.duration;
        if (isNaN(duration)) return;
        audio.currentTime = (e.offsetX / this.clientWidth) * duration;
    });

    volumeSlider.addEventListener('input', function() { audio.volume = this.value / 100; });

    function parseLRC(lrcString) {
        lyrics = []; lyricsBox.innerHTML = '';
        lrcString.split('\n').filter(l => l.trim()).forEach(line => {
            const m = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/.exec(line);
            if (m) {
                const time = parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/100;
                const text = line.replace(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/, '').trim();
                if (text) {
                    lyrics.push({ time, text });
                    const p = document.createElement('p'); p.innerText = text; p.className = 'lyric-line'; p.dataset.time = time;
                    lyricsBox.appendChild(p);
                }
            }
        });
    }

    function syncLyrics(ct) {
        if (!lyrics.length) return;
        let ai = -1;
        for (let i = 0; i < lyrics.length; i++) { if (ct >= lyrics[i].time) ai = i; else break; }
        if (ai !== -1) {
            document.querySelectorAll('.lyric-line').forEach(l => l.classList.remove('active'));
            const al = document.querySelectorAll('.lyric-line')[ai];
            if (al) { al.classList.add('active'); lyricsBox.scrollTop = al.offsetTop - lyricsBox.clientHeight/2 + al.clientHeight/2; }
        }
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', nextSong);
    </script>
</body>
</html>
