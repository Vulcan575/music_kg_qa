<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员注册 - 音乐知识图谱</title>
    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .register-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 50px;
            width: 440px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .register-header { text-align: center; margin-bottom: 30px; }
        .register-header h1 { font-size: 2em; margin-bottom: 10px; }
        .register-header p { color: #aaa; font-size: 14px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #ddd; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px 15px; border: none; border-radius: 8px;
            font-size: 14px; background: rgba(255, 255, 255, 0.15); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.4); }
        .form-group input:focus { outline: none; border-color: #4ecdc4; box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2); }

        .btn-register {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white; transition: all 0.3s; margin-top: 10px;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4); }
        .btn-register:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .footer-links { text-align: center; margin-top: 25px; font-size: 14px; }
        .footer-links a { color: #667eea; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }

        .password-rules { font-size: 12px; color: #999; line-height: 1.8; list-style: none; padding: 0; margin-top: 8px; }
        .password-rules li { padding-left: 18px; position: relative; }
        .password-rules li::before {
            content: '✗'; position: absolute; left: 0; color: #ff4d4f;
        }
        .password-rules li.valid::before { content: '✓'; color: #52c41a; }
        .password-rules li.valid { color: #52c41a; }

        .mismatch { color: #ff4d4f; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    {% raw %}
    <div id="app">
        <div class="register-container">
            <div class="register-header">
                <h1>🛡️ 管理员注册</h1>
                <p>注册音乐知识图谱管理员账户</p>
            </div>

            <div class="form-group">
                <label>账号</label>
                <input type="text" v-model="username" placeholder="请输入管理员账号">
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" v-model="password" placeholder="请输入密码 (8-16位)" @input="checkPassword">
                <ul class="password-rules">
                    <li :class="{ valid: rules.length }">长度 8-16 位</li>
                    <li :class="{ valid: rules.letter }">包含字母</li>
                    <li :class="{ valid: rules.number }">包含数字</li>
                    <li :class="{ valid: rules.special }">包含特殊符号</li>
                </ul>
            </div>

            <div class="form-group">
                <label>确认密码</label>
                <input type="password" v-model="confirmPassword" placeholder="请再次输入密码">
                <div class="mismatch" v-if="password && confirmPassword && password !== confirmPassword">
                    两次密码不一致！
                </div>
            </div>

            <div class="form-group">
                <label>邀请码</label>
                <input type="text" v-model="inviteCode" placeholder="请输入管理员邀请码">
            </div>

            <button class="btn-register" @click="handleRegister" :disabled="!isFormValid || loading">
                {{ loading ? '注册中...' : '注 册' }}
            </button>

            <div class="footer-links">
                <a href="/admin/login">← 返回管理员登录</a>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    username: '',
                    password: '',
                    confirmPassword: '',
                    inviteCode: '',
                    loading: false,
                    rules: {
                        length: false,
                        letter: false,
                        number: false,
                        special: false
                    }
                }
            },
            computed: {
                isFormValid() {
                    return this.username &&
                           this.password &&
                           this.confirmPassword &&
                           this.password === this.confirmPassword &&
                           this.inviteCode &&
                           Object.values(this.rules).every(r => r);
                }
            },
            methods: {
                checkPassword() {
                    const p = this.password;
                    this.rules.length = p.length >= 8 && p.length <= 16;
                    this.rules.letter = /[a-zA-Z]/.test(p);
                    this.rules.number = /[0-9]/.test(p);
                    this.rules.special = /[!@#$%^&*(),.?":{}|<>]/.test(p);
                },
                async handleRegister() {
                    if (!this.isFormValid) return;
                    this.loading = true;
                    try {
                        const res = await axios.post('/api/admin/register', {
                            username: this.username,
                            password: this.password,
                            confirm_password: this.confirmPassword,
                            invite_code: this.inviteCode
                        });
                        if (res.data.success) {
                            alert('注册成功！即将跳转登录');
                            window.location.href = '/admin/login';
                        } else {
                            alert('注册失败: ' + (res.data.message || '未知错误'));
                        }
                    } catch (err) {
                        alert('注册请求失败，请检查网络');
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount('#app');
    </script>
    {% endraw %}
</body>
</html>
